<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dar Lalla - Connexion</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #f3dcc8, #8b1e3f);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            width: 900px;
            min-height: 520px;
            background: white;
            border-radius: 28px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.18);
            animation: fadeIn 0.8s ease;
        }

        .left-panel {
            width: 45%;
            background: linear-gradient(135deg, #7b1e3a, #b8860b);
            color: white;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 42px;
            font-weight: 700;
        }

        .left-panel p {
            margin-top: 20px;
            line-height: 1.8;
            opacity: 0.95;
        }

        .right-panel {
            width: 55%;
            padding: 55px;
        }

        .title {
            color: #7b1e3a;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 35px;
        }

        .form-control {
            border-radius: 14px;
            padding: 13px;
        }

        .btn-login {
            background: #7b1e3a;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 13px;
            width: 100%;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #5c132a;
            transform: translateY(-2px);
        }

        .register-link {
            margin-top: 25px;
            text-align: center;
        }

        .register-link a {
            color: #7b1e3a;
            font-weight: 600;
            text-decoration: none;
        }

        .alert {
            border-radius: 12px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 768px) {
            .login-container {
                width: 92%;
                flex-direction: column;
            }

            .left-panel, .right-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="left-panel">
        <h1>Dar Lalla</h1>
        <p>
            Découvrez l’élégance marocaine à travers une boutique traditionnelle
            moderne : caftans, takchitas, mdammas et accessoires artisanaux.
        </p>
    </div>

    <div class="right-panel">
        <h2 class="title">Connexion</h2>
        <p class="subtitle">Connectez-vous pour accéder à votre espace.</p>

        <div th:if="${param.error}" class="alert alert-danger">
            Email ou mot de passe incorrect.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Déconnexion réussie.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label>Email</label>
                <input type="text" name="username" class="form-control" placeholder="Entrez votre email" required>
            </div>

            <div class="mb-4">
                <label>Mot de passe</label>
                <input type="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
            </div>

            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <div class="register-link">
            Vous n’avez pas de compte ?
            <a th:href="@{/register}">Créer un compte</a>
        </div>
    </div>

</div>

</body>
</html>
