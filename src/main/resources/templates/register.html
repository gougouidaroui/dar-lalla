<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dar Lalla - Inscription</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #f8f3ed, #f3e5d8);
            height: 100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-card{
            width:450px;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .title{
            text-align:center;
            color:#7b1e3a;
            font-weight:600;
            margin-bottom:30px;
        }

        .btn-register{
            background:#7b1e3a;
            color:white;
            border:none;
            border-radius:10px;
            padding:10px;
            width:100%;
            transition:0.3s;
        }

        .btn-register:hover{
            background:#5c132a;
        }

        .form-control{
            border-radius:10px;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            color:#7b1e3a;
            text-decoration:none;
            font-weight:500;
        }

    </style>

</head>

<body>

<div class="register-card">

    <h2 class="title">Dar Lalla</h2>

    <form th:action="@{/register}" method="post" th:object="${user}">

        <div class="mb-3">
            <label>Nom complet</label>
            <input type="text"
                   th:field="*{nom}"
                   class="form-control"
                   placeholder="Entrez votre nom"
                   required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   th:field="*{email}"
                   class="form-control"
                   placeholder="Entrez votre email"
                   required>
        </div>

        <div class="mb-3">
            <label>Mot de passe</label>
            <input type="password"
                   th:field="*{password}"
                   class="form-control"
                   placeholder="Entrez votre mot de passe"
                   required>
        </div>

        <button type="submit" class="btn-register">
            S'inscrire
        </button>

    </form>

    <div class="login-link">
        Déjà un compte ?
        <a href="/login">Se connecter</a>
    </div>

</div>

</body>
</html>
