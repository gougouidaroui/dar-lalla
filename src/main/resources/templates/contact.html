<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Dar Lalla - Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
    background:#f9f3ec;
    font-family:'Poppins',sans-serif;
}

/* NAVBAR */

.navbar-custom{
    background:#4b0014;
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#d4a44d;
    font-size:50px;
    font-weight:bold;
    font-family:'Playfair Display',serif;
}

.menu{
    display:flex;
    gap:30px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.menu a:hover{
    color:#d4a44d;
}

.icons{display:flex;gap:20px;}
.icons a{color:white;transition:0.3s;}
.icons a:hover{color:#d4a44d;}

/* CONTACT */

.contact-section{
    padding:80px 20px;
}

.contact-box{
    background:white;
    padding:50px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.contact-title{
    text-align:center;
    margin-bottom:50px;
}

.contact-title h1{
    font-size:60px;
    color:#5a0015;
    font-family:'Playfair Display',serif;
}

.contact-title p{
    color:#777;
}

.form-control{
    height:55px;
    border-radius:12px;
    border:1px solid #ddd;
}

textarea.form-control{
    height:150px;
}

.btn-contact{
    background:#8b0f2f;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:12px;
    font-weight:600;
    transition:0.3s;
}

.btn-contact:hover{
    background:#5a0015;
}

/* FOOTER */

footer{
    background:#2b000c;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:60px;
}

footer span{
    color:#d4a44d;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar-custom">

    <div class="logo">
        DAR LALLA
    </div>

<div class="menu">
        <a href="/">ACCUEIL</a>
        <a href="/products?categorie=Takchita">TAKCHITA</a>
        <a href="/products?categorie=Caftan">CAFTAN</a>
        <a href="/products?categorie=Djellaba">DJELLABA</a>
        <a href="/products?categorie=Mdamma">MDAMMA</a>
        <a href="/contact">CONTACT</a>
    </div>

    <div class="icons">
        <a href="/order" style="color:white;font-size:20px;"><i class="bi bi-receipt"></i></a>
        <a href="/cart" style="color:white;font-size:20px;"><i class="bi bi-bag"></i></a>
        <a href="/login" style="color:white;font-size:20px;"><i class="bi bi-person"></i></a>
    </div>

</div>

<!-- CONTACT -->

<section class="contact-section">

<div class="container">

<div class="contact-title">

<h1>Contactez-Nous</h1>

<p>
Nous sommes disponibles pour répondre à toutes vos questions.
</p>

</div>

<div class="contact-box">

<div class="row">

<div class="col-md-6 mb-4">

<label>Nom complet</label>

<input type="text" class="form-control">

</div>

<div class="col-md-6 mb-4">

<label>Email</label>

<input type="email" class="form-control">

</div>

<div class="col-12 mb-4">

<label>Sujet</label>

<input type="text" class="form-control">

</div>

<div class="col-12 mb-4">

<label>Message</label>

<textarea class="form-control"></textarea>

</div>

<div class="col-12 text-center">

<button class="btn-contact">
<i class="fa-solid fa-paper-plane"></i>
 Envoyer
</button>

</div>

</div>

</div>

</div>

</section>

<!-- FOOTER -->

<footer>

© 2026 <span>Dar Lalla</span> — Élégance Marocaine

</footer>

</body>
</html>
