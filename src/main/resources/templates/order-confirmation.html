<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Commande confirmée - Dar Lalla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--burgundy:#5a0015;--gold:#d4a44d;--cream:#fff8f1;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:var(--cream);}
        .navbar-custom{background:#3d0010;padding:18px 60px;display:flex;align-items:center;justify-content:space-between;}
        .logo{display:flex;align-items:center;gap:15px;}
        .logo-circle{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:35px;font-family:'Playfair Display',serif;}
        .logo-text h2{color:var(--gold);font-family:'Playfair Display',serif;margin:0;font-size:38px;}
        .logo-text p{color:#f4d7a1;margin:0;letter-spacing:3px;font-size:12px;}
        .confirmation-container{max-width:600px;margin:80px auto;padding:40px;text-align:center;background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);}
        .confirmation-container i{font-size:80px;color:#28a745;margin-bottom:20px;}
        .confirmation-container h2{color:var(--burgundy);font-family:'Playfair Display',serif;font-size:36px;margin-bottom:15px;}
        .confirmation-container p{color:#666;font-size:18px;margin-bottom:10px;}
        .order-number{background:rgba(212,164,77,0.1);padding:15px;border-radius:10px;margin:20px 0;}
        .order-number strong{color:var(--burgundy);font-size:20px;}
        .btn-home{background:var(--burgundy);color:white;padding:15px 40px;text-decoration:none;border-radius:10px;font-weight:600;display:inline-block;margin-top:20px;transition:0.3s;}
        .btn-home:hover{background:var(--gold);color:var(--burgundy);}
    </style>
</head>
<body>

<div class="navbar-custom">
    <div class="logo">
        <div class="logo-circle">D</div>
        <div class="logo-text">
            <h2>DAR LALLA</h2>
            <p>ÉLÉGANCE MAROCAINE</p>
        </div>
    </div>
</div>

<div class="confirmation-container">
    <i class="bi bi-check-circle-fill"></i>
    <h2>Merci pour votre commande !</h2>
    <p>Votre commande a été enregistrée avec succès.</p>
    <div class="order-number">
        <p style="margin:0;color:#666;font-size:14px;">Numéro de commande</p>
        <strong th:text="${'#' + orderId}">#1</strong>
    </div>
    <p>Vous recevrez un email de confirmation sous peu.</p>
    <div style="margin-top:20px;">
        <a th:href="@{'/order/receipt/' + ${orderId} + '/download'}" style="background:var(--gold);color:var(--burgundy);padding:15px 30px;text-decoration:none;border-radius:10px;font-weight:600;display:inline-block;margin-right:15px;">
            <i class="bi bi-file-earmark-pdf"></i> Télécharger le reçu
        </a>
        <a href="/" class="btn-home">Retour à l'accueil</a>
    </div>
</div>

</body>
</html>
