<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dar Lalla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--burgundy:#5a0015;--gold:#d4a44d;--cream:#fff8f1;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:var(--cream);}
        .top-bar{background:linear-gradient(to right,#6d071f,#8b0f2f,#6d071f);color:#f5d28d;padding:10px;text-align:center;font-size:14px;}
        .top-bar span{margin:0 25px;}
        .navbar-custom{background:#3d0010;padding:18px 60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:999;}
        .logo{display:flex;align-items:center;gap:15px;}
        .logo-circle{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:35px;font-family:'Playfair Display',serif;box-shadow:0 0 20px rgba(212,164,77,0.5);}
        .logo-text h2{color:var(--gold);font-family:'Playfair Display',serif;margin:0;font-size:38px;}
        .logo-text p{color:#f4d7a1;margin:0;letter-spacing:3px;font-size:12px;}
        .menu{display:flex;gap:35px;justify-content:center;}
        .menu a{color:white;text-decoration:none;font-weight:600;transition:0.3s;}
        .menu a:hover{color:var(--gold);}
        .icons{display:flex;gap:20px;}
        .icons a{color:white;font-size:24px;transition:0.3s;}
        .icons a:hover{color:var(--gold);transform:translateY(-3px);}
    </style>
</head>
<body>
<div th:fragment="navbar">
<div class="top-bar">
    <span><i class="bi bi-truck"></i> Livraison à partir de 100 MAD</span>
    <span><i class="bi bi-gem"></i> Qualité Premium</span>
    <span><i class="bi bi-shield-check"></i> Paiement sécurisé</span>
</div>

<div class="navbar-custom">
    <div class="logo">
        <a href="/" style="text-decoration:none;display:flex;align-items:center;gap:15px;">
            <div class="logo-circle">D</div>
            <div class="logo-text">
                <h2>DAR LALLA</h2>
                <p>ÉLÉGANCE MAROCAINE</p>
            </div>
        </a>
    </div>

    <div class="menu">
        <a href="/">ACCUEIL</a>
        <a href="/products?categorie=Takchita">TAKCHITA</a>
        <a href="/products?categorie=Caftan">CAFTAN</a>
        <a href="/products?categorie=Djellaba">DJELLABA</a>
        <a href="/products?categorie=Mdamma">MDAMMA</a>
        <a href="/contact">CONTACT</a>
    </div>

    <div class="icons">
        <a href="/order" title="Mes commandes"><i class="bi bi-receipt"></i></a>
        <a href="/cart" title="Panier"><i class="bi bi-bag"></i></a>
        <a href="/login" title="Connexion"><i class="bi bi-person"></i></a>
    </div>
</div>
</div>
</body>
</html>
